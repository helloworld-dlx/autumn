function render(){const s=session?.state||'OFF',quick=selectedMode==='quick',active=s!=='OFF',label=quick?'Quick':'Conversation',action=active?'Stop voice':'Start '+label;status.textContent=s;duskline.className='duskline '+s.toLowerCase();turn.textContent='TURN '+(session?.turn||0);quickButton.classList.toggle('selected',quick);conversationButton.classList.toggle('selected',!quick);modeChip.textContent=label+' ▾';modeChip.disabled=active;modeChip.setAttribute('aria-expanded',String(!modeSheet.hidden));quickButton.disabled=active;conversationButton.disabled=active;startButton.className='voice-button '+s.toLowerCase();startButton.setAttribute('aria-label',action);startButton.title=action;startButton.innerHTML=active?'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1"/></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Zm-5 8a5 5 0 0 0 10 0M12 16v4m-3 0h6"/></svg>';stopButton.disabled=!active}function appendInline(node,text){const pattern=/(\[([^\]]+)\]\(([^)\s]+)\)|\*\*([^*]+)\*\*|__([^_]+)__|`([^`]+)`|\*([^*]+)\*|_([^_]+)_)/g;let last=0;for(const match of text.matchAll(pattern)){node.append(document.createTextNode(text.slice(last,match.index)));if(match[2]!==undefined){let url;try{url=new URL(match[3],location.href)}catch{}if(url&&['http:','https:'].includes(url.protocol)){const link=document.createElement('a');link.href=url.href;link.target='_blank';link.rel='noopener noreferrer';link.textContent=match[2];node.append(link)}else node.append(document.createTextNode(match[0]))}else{const tag=match[4]!==undefined||match[5]!==undefined?'strong':match[6]!==undefined?'code':'em',element=document.createElement(tag);element.textContent=match[4]??match[5]??match[6]??match[7]??match[8];node.append(element)}last=match.index+match[0].length}node.append(document.createTextNode(text.slice(last)))}
function addTable(root,header,rows){const wrap=document.createElement('div'),table=document.createElement('table'),head=document.createElement('thead'),body=document.createElement('tbody'),tr=document.createElement('tr');wrap.className='table-wrap';for(const cell of header){const th=document.createElement('th');appendInline(th,cell);tr.append(th)}head.append(tr);for(const row of rows){const line=document.createElement('tr');for(const cell of row){const td=document.createElement('td');appendInline(td,cell);line.append(td)}body.append(line)}table.append(head,body);wrap.append(table);root.append(wrap)}
function tableCells(line){return line.trim().replace(/^\||\|$/g,'').split('|').map(cell=>cell.trim())}
function isTableRule(line){return /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(line)}
function markdown(text){const root=document.createElement('div');root.className='markdown';const lines=String(text).split('\n');let list,ordered=false,code;const closeList=()=>{list=null};for(let i=0;i<lines.length;i+=1){const line=lines[i];if(line.startsWith('```')){if(code){root.append(code);code=null}else{closeList();code=document.createElement('pre');const inner=document.createElement('code');code.append(inner)}continue}if(code){code.firstChild.textContent+=(code.firstChild.textContent?'\n':'')+line;continue}if(line.includes('|')&&isTableRule(lines[i+1]||'')){closeList();const header=tableCells(line),rows=[];i+=2;while(i<lines.length&&lines[i].includes('|')&&!/^\s*$/.test(lines[i])){rows.push(tableCells(lines[i]));i+=1}i-=1;addTable(root,header,rows);continue}const heading=line.match(/^(#{1,3})\s+(.*)$/),item=line.match(/^[-*]\s+(.*)$/),numbered=line.match(/^\d+\.\s+(.*)$/),quote=line.match(/^>\s?(.*)$/);if(/^\s{0,3}([-*_])(?:\s*\1){2,}\s*$/.test(line)){closeList();root.append(document.createElement('hr'))}else if(heading){closeList();const element=document.createElement('h'+heading[1].length);appendInline(element,heading[2]);root.append(element)}else if(item||numbered){const isOrdered=Boolean(numbered);if(!list||ordered!==isOrdered){closeList();list=document.createElement(isOrdered?'ol':'ul');ordered=isOrdered;root.append(list)}const element=document.createElement('li');appendInline(element,(item||numbered)[1]);list.append(element)}else{closeList();const element=document.createElement(quote?'blockquote':'p');appendInline(element,quote?quote[1]:line||' ');root.append(element)}}if(code)root.append(code);return root}
function show(label,text,asMarkdown=false,reply=''){debug.replaceChildren();const heading=document.createElement('span');heading.className='label';heading.textContent=label;debug.append(heading);if(asMarkdown)debug.append(markdown(text));else{const body=document.createElement('div');body.style.whiteSpace='pre-wrap';body.textContent=text;debug.append(body)}if(reply){const actions=document.createElement('div');actions.className='reply-actions';const copy=document.createElement('button');copy.type='button';copy.textContent='Copy reply';copy.onclick=async()=>{try{await navigator.clipboard.writeText(reply);copy.textContent='Copied'}catch{copy.textContent='Copy unavailable'}};actions.append(copy);debug.append(actions)}}
function renderTurn(transcript,reply){lastUser.textContent=transcript;lastAutumn.replaceChildren(markdown(reply));}
function clearCapture(){cancelAnimationFrame(rafId);clearTimeout(idleTimer);audioContext?.close();audioContext=null;analyser=null;stream?.getTracks().forEach(track=>track.stop());stream=null}
function stopCapture(send){uploadOnStop=send;cancelAnimationFrame(rafId);clearTimeout(idleTimer);if(recorder?.state==='recording')recorder.stop();else clearCapture()}
async function beginListening(){if(!session.shouldListen())return;render();speechSeen=false;silenceSince=0;chunks=[];try{stream=await navigator.mediaDevices.getUserMedia({audio:true});if(!session.shouldListen()){clearCapture();return}recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{const send=uploadOnStop;uploadOnStop=false;clearCapture();if(send)sendTurn()};recorder.start();audioContext=new AudioContext();analyser=audioContext.createAnalyser();analyser.fftSize=1024;audioContext.createMediaStreamSource(stream).connect(analyser);idleTimer=setTimeout(()=>{if(!speechSeen){session.idleExpired();stopCapture(false);show('会话','长时间未说话，已自动结束。');render()}},IDLE_MS);monitor()}catch(error){session.stop();clearCapture();show('错误','无法使用麦克风：'+error.message);render()}}
function monitor(){if(!session.shouldListen()||!analyser)return;const samples=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(samples);let sum=0;for(const value of samples)sum+=value*value;const rms=Math.sqrt(sum/samples.length),now=performance.now();duskline.style.setProperty('--input-level',String(Math.min(1,Math.max(0,(rms-SPEECH_RMS*.35)/(SPEECH_RMS*4)))));if(rms>=SPEECH_RMS){speechSeen=true;silenceSince=0;clearTimeout(idleTimer)}else if(speechSeen){silenceSince ||= now;if(now-silenceSince>=SILENCE_MS){session.processing();render();stopCapture(true);return}}rafId=requestAnimationFrame(monitor)}
async function sendTurn(){try{const audio=new Blob(chunks,{type:recorder.mimeType||'audio/webm'}),form=new FormData();form.append('audio',audio,'utterance.webm');form.append('sessionId',session.sessionId);const response=await fetch('/api/turn',{method:'POST',body:form}),data=await response.json();if(!response.ok)throw Error(data.message||data.error);if(!session.running)return;const latency=data.latencyMs||{};renderTurn(data.transcript,data.reply);show('Timing','STT '+latency.stt+' ms · Autumn '+latency.autumn+' ms · TTS '+latency.tts+' ms · Total '+latency.total+' ms',false,data.reply);session.speaking();render();player.src=data.audioUrl;player.volume=1;player.onended=()=>{player.removeAttribute('src');player.load();session.playbackEnded();render();if(session.shouldListen())beginListening()};player.onerror=()=>fail('音频播放失败');await player.play()}catch(error){fail(error.message)}}
function fail(message){session?.stop();player?.pause();player=null;clearCapture();show('错误',message);render()}
function selectMode(mode){selectedMode=mode;modeSheet.hidden=true;render()}
modeChip.onclick=()=>{if(!modeChip.disabled){modeSheet.hidden=!modeSheet.hidden;render()}}
function startVoice(mode){session=new ContinuousVoiceSession(crypto.randomUUID(),mode);session.start();render();player=new Audio();player.volume=0;player.src=SILENT_WAV;player.play().then(()=>{player.pause();player.currentTime=0;player.volume=1}).catch(()=>{});beginListening()}
quickButton.onclick=()=>selectMode('quick');
conversationButton.onclick=()=>selectMode('continuous');
startButton.onclick=()=>{if(session?.running)stopButton.click();else startVoice(selectedMode)};
stopButton.onclick=()=>{session.stop();player?.pause();player=null;stopCapture(false);show('会话','已停止。');render()};
render();
</script>
